<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Reservo — Presentación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     PALETA DE COLORES — LÍNEAS 14-43
     Para cambiar paleta: reemplazar solo este bloque :root
     Paletas predefinidas por giro al final del archivo (en JS)
     ══════════════════════════════════════════════════════════════ */
:root {
  /* Acento principal */
  --gold: #D4A0B9;
  --gold-light: #F2D5E3;
  --gold-05: rgba(212,160,185,0.05);
  --gold-08: rgba(212,160,185,0.08);
  --gold-10: rgba(212,160,185,0.1);
  --gold-12: rgba(212,160,185,0.12);
  --gold-20: rgba(212,160,185,0.2);
  --gold-30: rgba(212,160,185,0.3);
  /* Fondos */
  --black: #1A0F14;
  --black-90: rgba(26,15,20,0.9);
  --dark: #231519;
  --dark2: #2D1B21;
  /* Textos */
  --white: #FFF5F9;
  --white-06: rgba(255,255,255,0.06);
  --gray: #9B8A90;
  --text-muted: #AAAAAA;
  --text-light: #CCCCCC;
  /* WhatsApp mockup */
  --wa-bg: #ECE5DD;
  --wa-header: #075E54;
  --wa-user-msg: #DCF8C6;
  --wa-bot-msg: #FFFFFF;
  --wa-msg-text: #111111;
  --wa-time: #888888;
  /* Otros */
  --green-wa: #25D366;
  --shadow-color: rgba(0,0,0,0.6);
}

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, var(--gold-12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-tag {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 28px;
    text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.8);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .hero-sub {
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 300;
    color: var(--text-muted);
    max-width: 600px;
    line-height: 1.6;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  .hero-cta {
    opacity: 0;
    animation: fadeUp 0.8s ease 0.8s forwards;
  }

  .btn-gold {
    display: inline-block;
    background: var(--gold);
    color: var(--black);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 18px 48px;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .btn-gold:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
  }

  .scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    animation: fadeUp 0.8s ease 1.2s forwards;
    text-align: center;
  }

  .scroll-hint span {
    display: block;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .scroll-line {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    margin: 0 auto;
    animation: scrollPulse 2s ease infinite;
  }

  /* ── SECCIONES ── */
  .section-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 32px;
  }

  .section-title em {
    font-style: italic;
    color: var(--gold);
  }

  .section-desc {
    font-size: 18px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 680px;
  }

  /* ── STAT GRID ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    margin-top: 80px;
    background: var(--dark2);
  }

  .stat-card {
    background: var(--dark);
    padding: 56px 40px;
    transition: background 0.3s ease;
  }

  .stat-card:hover { background: var(--dark2); }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 12px;
  }

  .stat-label {
    font-size: 14px;
    font-weight: 300;
    color: var(--gray);
    line-height: 1.5;
  }

  /* ── DEMO WHATSAPP ── */
  .demo-section {
    background: var(--dark);
    padding: 120px 40px;
  }

  .demo-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .demo-text .section-label { margin-bottom: 24px; }

  .demo-text h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 24px;
  }

  .demo-text h2 em {
    font-style: italic;
    color: var(--gold);
  }

  .demo-text p {
    font-size: 16px;
    font-weight: 300;
    color: var(--gray);
    line-height: 1.7;
    margin-bottom: 16px;
  }

  /* WhatsApp mockup */
  .wa-phone {
    background: var(--wa-bg);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 40px 80px var(--shadow-color);
    max-width: 360px;
    margin: 0 auto;
  }

  .wa-header {
    background: var(--wa-header);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .wa-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--black);
    font-size: 16px;
    flex-shrink: 0;
  }

  .wa-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--white);
  }

  .wa-status {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
  }

  .wa-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 400px;
    overflow-y: auto;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
    opacity: 0;
    transform: translateY(10px);
  }

  .msg.user {
    background: var(--wa-user-msg);
    color: var(--wa-msg-text);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    background: var(--wa-bot-msg);
    color: var(--wa-msg-text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .msg.visible {
    animation: msgIn 0.4s ease forwards;
  }

  .msg-time {
    font-size: 11px;
    color: var(--wa-time);
    text-align: right;
    margin-top: 4px;
  }

  /* ── FEATURES ── */
  .features-section {
    padding: 120px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2px;
    margin-top: 64px;
    background: var(--dark2);
  }

  .feature-card {
    background: var(--dark);
    padding: 56px 48px;
    transition: background 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .feature-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 0;
    background: var(--gold);
    transition: height 0.4s ease;
  }

  .feature-card:hover::before { height: 100%; }
  .feature-card:hover { background: var(--dark2); }

  .feature-icon {
    font-size: 32px;
    margin-bottom: 24px;
  }

  .feature-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--white);
  }

  .feature-desc {
    font-size: 15px;
    font-weight: 300;
    color: var(--gray);
    line-height: 1.7;
  }

  /* ── PRECIO ── */
  .precio-section {
    background: var(--dark);
    padding: 120px 40px;
    text-align: center;
  }

  .precio-inner {
    max-width: 700px;
    margin: 0 auto;
  }

  .precio-card {
    border: 1px solid var(--gold-30);
    padding: 64px 56px;
    margin-top: 64px;
    position: relative;
    background: linear-gradient(135deg, var(--gold-05) 0%, transparent 60%);
  }

  .precio-badge {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--black);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 24px;
    white-space: nowrap;
  }

  .precio-plan {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
  }

  .precio-amount {
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 8px;
  }

  .precio-amount sup {
    font-size: 32px;
    vertical-align: super;
  }

  .precio-period {
    font-size: 16px;
    color: var(--gray);
    margin-bottom: 48px;
  }

  .precio-features {
    list-style: none;
    text-align: left;
    margin-bottom: 48px;
  }

  .precio-features li {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--white-06);
    font-size: 15px;
    color: var(--text-light);
    font-weight: 300;
  }

  .precio-features li::before {
    content: '✦';
    color: var(--gold);
    flex-shrink: 0;
    font-size: 12px;
    margin-top: 2px;
  }

  .setup-note {
    font-size: 13px;
    color: var(--gray);
    margin-top: 24px;
  }

  /* ── CTA FINAL ── */
  .cta-section {
    padding: 160px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .cta-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 50% 50%, var(--gold-08) 0%, transparent 70%);
    pointer-events: none;
  }

  .cta-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(40px, 6vw, 80px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 32px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .cta-section h2 em {
    font-style: italic;
    color: var(--gold);
  }

  .cta-section p {
    font-size: 18px;
    color: var(--gray);
    margin-bottom: 56px;
    font-weight: 300;
  }

  /* ── LOGO ── */
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--white);
  }

  .logo span { color: var(--gold); }

  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--black-90);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--white-06);
  }

  .navbar-tag {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    background: var(--gold-10);
    border: 1px solid var(--gold-20);
    padding: 6px 16px;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 48px auto;
  }

  .footer-credit {
    font-size: 13px;
    color: var(--gray);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .stat-grid { grid-template-columns: 1fr; }
    .demo-inner { grid-template-columns: 1fr; }
    .features-grid { grid-template-columns: 1fr; }
    .navbar { padding: 20px 24px; }
    .demo-section { padding: 80px 24px; }
    .precio-section { padding: 80px 24px; }
    .cta-section { padding: 100px 24px; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">Reserv<span>●</span></div>
  <div class="navbar-tag" id="navbar-tag"></div>
</nav>

<!-- HERO -->
<section class="hero">
  <p class="hero-tag" id="hero-tag"></p>
  <h1 id="hero-title"></h1>
  <p class="hero-sub" id="hero-sub"></p>
  <div class="hero-cta">
    <a href="#demo" class="btn-gold">Ver cómo funciona</a>
  </div>

    <span>Scroll</span>

</section>

<!-- PROBLEMA -->
<section style="padding: 120px 40px; max-width: 1100px; margin: 0 auto;">
  <div class="reveal">
    <p class="section-label" id="problema-label"></p>
    <h2 class="section-title" id="problema-title"></h2>

    <div class="stat-card">

    <div class="stat-card">
      <div class="stat-number" id="stat3-number"></div>

<!-- DEMO -->
<section class="demo-section" id="demo">
  <div class="demo-inner">
    <div class="demo-text reveal">
      <p class="section-label">En acción</p>
      <h2 id="demo-title"></h2>
      <p id="demo-desc1"></p>
      <p id="demo-desc2"></p>
    </div>

    <div class="reveal">
      <div class="wa-phone">
        <div class="wa-header">

</section>

<!-- FEATURES -->
<section class="features-section">
  <div class="reveal">
    <p class="section-label" id="features-label"></p>
    <h2 class="section-title" id="features-title"></h2>
  </div>
  <div class="features-grid reveal" id="features-grid"></div>
</section>

<!-- PRECIO -->
<section class="precio-section">
  <div class="precio-inner">
    <div class="reveal">
      <p class="section-label">Inversión</p>
      <h2 class="section-title" id="precio-title"></h2>
    </div>

    <div class="precio-card reveal">
      <div class="precio-badge" id="precio-badge"></div>
      <div class="precio-plan">Mensualidad</div>
      <div class="precio-amount" id="precio-amount"></div>
      <div class="precio-period" id="precio-period"></div>
      <ul class="precio-features" id="precio-features-list"></ul>
      <a href="#activar" class="btn-gold" style="display: block; text-align: center; text-decoration: none;" id="precio-cta"></a>
      <p class="setup-note" id="setup-note"></p>
    </div>
  </div>
</section>

<!-- CTA FINAL -->
<section class="cta-section" id="activar">
  <div class="reveal">
    <h2 id="cta-title"></h2>
    <p id="cta-sub"></p>
    <a href="" class="btn-gold" id="cta-btn"></a>
    <div class="divider" style="margin-top: 64px;"></div>
    <p class="footer-credit">Reservo by Fixy IT · México</p>
  </div>
</section>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURACIÓN DEL NEGOCIO — LÍNEAS 500-620 approx.
//
// Para personalizar para otro cliente:
//   1. Cambiar los datos en este objeto NEGOCIO
//   2. Cambiar la paleta :root en el CSS (líneas 14-43)
//   3. Listo — todo lo demás se renderiza automáticamente
//
// ══════════════════════════════════════════════════════════════
const NEGOCIO = {

  // ── IDENTIDAD (cambiar por cada cliente) ──

  nombreCorto: 'Javeli',             // Nombre corto para badges y CTAs
  inicial: 'J',                      // Inicial para el avatar de WhatsApp
  giro: 'salón',                     // Tipo: salón, barbería, pastelería, veterinaria, spa, restaurante
  giroPlural: 'salones de belleza',  // Para textos descriptivos
  dueno: 'Alejandra',                // Nombre del dueño/a

  // ── CONTACTO ──
  whatsapp: '528117633984',           // Número de WhatsApp sin + ni espacios

  // ── PRECIOS ──
  precioMensual: '990',              // Precio mensual sin símbolo
  precioPeriodo: 'MXN / mes · sin plazos forzosos',
  precioSetup: '2,500',              // Precio de setup sin símbolo
  plan: 'Plan Básico',               // Nombre del plan

  // ── SERVICIOS INCLUIDOS EN EL PLAN ──
  serviciosPlan: [
    'Respuesta automática 24/7 en WhatsApp',
    'Agendamiento, cancelación y reprogramación',
    'Integración con Google Calendar',
    'Consulta de disponibilidad en tiempo real',
    'Información de servicios y precios de tu negocio',
    'Soporte y mejoras continuas'
  ],

  // ── FEATURES DEL NEGOCIO ──
  // desc: null = se genera automáticamente con nombreCorto
  features: [
    { icon: '📅', titulo: 'Agenda inteligente', desc: 'Reservo consulta tu Google Calendar en tiempo real y solo ofrece horarios disponibles. Sin dobles reservas. Sin errores.' },
    { icon: '❌', titulo: 'Cancelaciones sin drama', desc: 'Cuando una clienta cancela, Reservo lo gestiona, libera el espacio y te notifica. Tu agenda siempre actualizada.' },
    { icon: '🔄', titulo: 'Reprogramaciones automáticas', desc: '¿La clienta quiere cambiar su cita? Reservo cancela la anterior y agenda la nueva. Todo en una conversación.' },
    { icon: '💬', titulo: 'Responde como tú', desc: null }
  ],

  // ── CHAT DEMO — conversación simulada ──
  chatDemo: [
    { type: 'user', text: 'Hola, quiero agendar una keratina 💅', time: '10:23' },
    { type: 'bot',  text: '¡Hola! Con gusto te ayudo 😊 ¿Qué día y hora te viene mejor?', time: '10:23' },
    { type: 'user', text: 'El viernes a las 3pm', time: '10:24' },
    { type: 'bot',  text: '✅ Perfecto. Tenemos disponibilidad el *Viernes 8 de mayo a las 15:00* para Keratina.\n\n¿A nombre de quién agendo?', time: '10:24' },
    { type: 'user', text: 'A nombre de Carmen', time: '10:25' },
    { type: 'bot',  text: '¡Listo Carmen! 🌸\n✨ *Cita confirmada*\n📅 Viernes 8 de mayo\n⏰ 15:00 hrs\n💆 Keratina\n\n¡Te esperamos!', time: '10:25' },
  ],

  // ── TEXTOS POR SECCIÓN ──
  // Usa null para que se genere automáticamente con el nombre/giro del negocio
  textos: {

const N = NEGOCIO;

// Género del giro para textos naturales
const giroFemenino = ['barbería', 'pastelería', 'veterinaria', 'cafetería'].includes(N.giro) ? false :
                     ['salón', 'spa', 'restaurante'].includes(N.giro) ? false : false;
const clienteGenero = ['salón', 'spa'].includes(N.giro) ? 'clientas' : 'clientes';

// Textos automáticos según giro/nombre
if (!N.textos.heroTag) N.textos.heroTag = `El futuro de tu ${N.giro}`;
if (!N.textos.problemaDesc) N.textos.problemaDesc = `Estás en medio de un servicio, con las manos ocupadas, y tu teléfono no para. ${clienteGenero.charAt(0).toUpperCase() + clienteGenero.slice(1)} esperando respuesta. Citas que se pierden. Horas que se van sin llenarse. Todo por no poder contestar a tiempo.`;
if (!N.textos.stat1Label) N.textos.stat1Label = `de los ${clienteGenero} no regresan si no reciben respuesta en menos de 1 hora`;
if (!N.textos.stat2Label) N.textos.stat2Label = `Reservo trabaja por ti incluso mientras duermes o atiendes a otra persona`;
if (!N.textos.demoDesc1) N.textos.demoDesc1 = `Reservo entiende lo que tu cliente quiere — fecha, hora, servicio — y lo agenda directamente en tu calendario de Google. Sin menús. Sin botones. Como si fuera tu mejor recepcionista.`;
if (!N.textos.featuresLabel) N.textos.featuresLabel = `Lo que Reservo hace por ti`;
if (!N.textos.featuresTitle) N.textos.featuresTitle = `Todo lo que necesita<br>tu ${N.giro}, <em>automatizado.</em>`;

// Feature "Responde como tú" — desc dinámica
const featureResponde = N.features.find(f => !f.desc);
if (featureResponde) {
  featureResponde.desc = `Entrenado con el tono y estilo de ${N.nombreCorto}. Tus ${clienteGenero} sentirán que hablan con una recepcionista real, no con un robot.`;
}

// ── RENDERIZAR ──
document.getElementById('page-title').textContent = `Reservo — Presentación ${N.nombreCorto}`;
document.getElementById('navbar-tag').textContent = `Presentación Exclusiva · ${N.nombreCorto}`;
document.getElementById('hero-tag').textContent = N.textos.heroTag;
document.getElementById('hero-title').innerHTML = N.textos.heroTitle;
document.getElementById('hero-sub').textContent = N.textos.heroSub;
document.getElementById('problema-label').textContent = N.textos.problemaLabel;

document.getElementById('cta-title').innerHTML = N.textos.ctaTitle;

const ctaBtn = document.getElementById('cta-btn');
ctaBtn.textContent = N.textos.ctaBtn;
ctaBtn.href = `https://wa.me/${N.whatsapp}`;

// Features grid
const featuresGrid = document.getElementById('features-grid');
N.features.forEach(f => {
  const card = document.createElement('div');
  card.className = 'feature-card';
  card.innerHTML = `
    <div class="feature-icon">${f.icon}</div>
    <div class="feature-title">${f.titulo}</div>
    <div class="feature-desc">${f.desc}</div>
  `;
  featuresGrid.appendChild(card);
});

// Precio features list
const precioList = document.getElementById('precio-features-list');
N.serviciosPlan.forEach(s => {
  const li = document.createElement('li');
  li.textContent = s;
  precioList.appendChild(li);
});

// ── Scroll reveal ──
const reveals = document.querySelectorAll('.reveal');
const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if (entry.isIntersecting) {
      setTimeout(() => entry.target.classList.add('visible'), i * 100);
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });
reveals.forEach(el => observer.observe(el));

// ── WhatsApp chat animation ──
const chat = document.getElementById('chat');
let msgIndex = 0;

function addMessage() {
  if (msgIndex >= N.chatDemo.length) {
    setTimeout(() => {
      chat.innerHTML = '';
      msgIndex = 0;
      setTimeout(addMessage, 800);
    }, 3000);
    return;
  }
  const msg = N.chatDemo[msgIndex];
  const div = document.createElement('div');
  div.className = `msg ${msg.type}`;
  div.innerHTML = msg.text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<strong>$1</strong>');
  div.innerHTML += `<div class="msg-time">${msg.time}</div>`;
  chat.appendChild(div);
  setTimeout(() => div.classList.add('visible'), 50);
  chat.scrollTop = chat.scrollHeight;
  msgIndex++;
  setTimeout(addMessage, 1200);
}

const chatObserver = new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting) {
    setTimeout(addMessage, 500);
    chatObserver.disconnect();
  }
}, { threshold: 0.3 });
chatObserver.observe(chat);
